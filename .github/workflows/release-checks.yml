name: release-checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  fastapi:
    name: FastAPI compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q services/api-fastapi

  bff:
    name: BFF syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api-node/package-lock.json
      - run: npm ci
      - run: npm run syntax

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet

  release-package:
    name: Release artifact package
    runs-on: ubuntu-latest
    needs:
      - web
      - mobile
      - fastapi
      - bff
      - compose
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Package release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_STAGE: staging
        run: bash scripts/release/package-artifacts.sh
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: fitconnect-release-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
